# Speculation labelling, from "Phương Pháp Nhận Diện Dấu Hiệu Đầu Cơ Cổ Phiếu".
#
# Every threshold and weight below is the document's. The four settings marked
# NOT IN THE DOCUMENT are ones it leaves open; they are here rather than in code
# so that what was specified and what was chosen stay distinguishable.

universe:
  # "toàn thị trường" — the whole market, not the liquid universe the alpha
  # model trades. Speculation concentrates in small illiquid names, so filtering
  # to the tradeable universe first would remove the population of interest.
  bar_status: normal
  min_volume: 1

# The document writes the rolling window as t-248..t but calls it 252 sessions,
# and divides the ratio by 248. One session either way moves nothing; both are
# 252 here so the two windows are the same length.
windows:
  percentile: 252   # pooled trailing window the Q75/Q90/Q95 come from
  ratio: 252        # window the "tỷ lệ đầu cơ" counts days over
  smooth: 5         # "Volatility 5 phiên" / "Range 5 phiên"

pvdi:
  long: 252         # ρ_expected and σ_correlation, "12 tháng gần nhất"
  short: 21         # ρ_observed. NOT IN THE DOCUMENT — it says only "giai đoạn
                    # ngắn". 21 sessions is one month.
  # PVDI_composite = w1·PVDI_daily + w2·PVDI_weekly. The document says the
  # weights are "tối ưu hóa dựa trên dữ liệu 12 tháng gần nhất" but gives no
  # objective to optimise against, and there is no ground-truth speculation
  # label to fit to. Inventing one would produce a number nobody could
  # reproduce, so the default is daily only. Set w_weekly to blend.
  w_daily: 1.0
  w_weekly: 0.0
  weekly_sessions: 5
  # Correlation is between price CHANGE and volume — the document's ρ_expected
  # is defined on "biến động giá", though the Pearson formula below it writes P
  # for price. Level-vs-volume over a year measures trend, not the price-volume
  # relationship the theory describes. Set to "close" for the literal reading.
  price_term: ret
  thresholds: [1.0, 2.0, 3.5]

turnover:
  # THE DOCUMENT'S DENOMINATOR IS FREE FLOAT AND WE DO NOT HAVE IT.
  # company_snapshot covers 51 tickers on one date; market_snapshot.listed_share
  # covers 1,620 tickers but on 4 sessions, all from the last two weeks. Neither
  # gives a share count for a 2010 bar, and using a 2026 count for one would be
  # both wrong and forward-looking.
  #
  # So the denominator is the stock's OWN trailing average volume. That keeps
  # what the measure is for — trading activity abnormal relative to this name's
  # normal — and keeps it dimensionless and comparable across stocks, which is
  # what the cross-sectional percentile step needs. It is NOT the document's
  # formula. Switch to free_float when the service has the history.
  denominator: own_volume   # own_volume | free_float
  fast: 21
  slow: 252

# BOTH label sets are built, every time, side by side. Following the document
# and improving on it are not a choice you have to make once — the columns sit
# next to each other so the difference is a query rather than an argument.
#
#   mentor    the document exactly as written    -> spec_label
#   adjusted  ONE change, listed below           -> spec_label_adj
#
# Everything else is the mentor's in both: the four dimensions, the 40/30/15/15
# weights, the 0-3 scoring, the 0.75/1.5/2.25 thresholds, the percentile idea,
# and the 12-month "tỷ lệ đầu cơ".
#
# Three changes were proposed on the strength of reading the formulas. Tested
# against forward returns, ONE helped and one actively hurt. The document was
# closer to right than the critique was — the two settings below that now read
# the same as `mentor` were reverted on evidence, not taste.
variants:
  mentor:
    volatility: signed
    range: absolute
    pvdi_scoring: fixed
  adjusted:
    # ONE change, and it is the only one the evidence supports.
    #
    # All eight combinations of the three candidate changes were scored against
    # forward returns on the dev period — see reports/. Each change is judged by
    # its four pairwise comparisons (the other two settings held fixed), at two
    # horizons, so each gets eight independent readings rather than one.
    #
    # 1. VOLATILITY, signed -> magnitude. HELPS, 8 of 8. The document's formula
    #    averages the SIGNED daily change, so a falling stock lands at the
    #    bottom of the distribution while the buckets only flag the top; its own
    #    theory paragraph says volatility rises on panic selling too. Of 14,561
    #    rows where a stock fell more than 5% a day over five sessions, the
    #    signed form calls ALL of them Bình thường.
    volatility: abs
    #
    # 2. RANGE, VND -> share of price. NO RELIABLE EFFECT. Absolute VND does
    #    largely rank price level — median price across the buckets runs
    #    6,910 / 15,000 / 21,740 / 34,780 — but changing it wins at one horizon
    #    and loses at the other, by margins smaller than the volatility effect.
    #    Reverted: there is no evidence to overrule the document here.
    range: absolute
    #
    # 3. PVDI, fixed thresholds -> percentiles. HURTS, 8 of 8, and it is the
    #    single most damaging change of the three. Rare-by-design is the point:
    #    forcing PVDI to fire on 5% of rows dilutes a precise signal into a
    #    generic one. The 58-row top bucket is a real consequence of the
    #    document's weighting, but it is not a defect worth fixing this way.
    pvdi_scoring: fixed

# Bình thường 0, Đầu cơ nhẹ 1, Đầu cơ 2, Đầu cơ mạnh 3.
quantiles: [0.75, 0.90, 0.95]

# BÁN THÁO — panic selling. NOT part of the mentor's document; a fifth component
# added because the four in it detect a stock being pushed UP and nothing else.
#
# Why this is separate rather than a wider Volatility. Measured on 9,776 sessions
# where a stock fell more than 5% a day for a week: his Volatility component
# labelled 100.0% of them Bình thường — not 95%, exactly 100%, because a signed
# mean puts a crash at the BOTTOM of the distribution and the buckets only flag
# the top. Turnover and Range did partly fire (mean scores 0.52 and 0.57), but
# the composite averaged 0.356 against the 1.50 that Đầu cơ needs.
#
# So `spec_score` is left EXACTLY as he wrote it and this scores alongside.
# Folding dumping into it would also be a category error: đầu cơ means
# speculation, and a stock being dumped is not being speculated on.
#
# The 40/30/15/15 split deliberately mirrors his, one role at a time: a primary
# measure of the phenomenon, a confirmation that the volume is real, and two
# supporting reads.
dumping:
  weights:
    downside: 0.40    # how hard it is actually falling
    sell_volume: 0.30 # is the selling real, or is it drifting down on nothing
    close_weakness: 0.15
    limit_down: 0.15
  thresholds: [0.75, 1.5, 2.25]
  window: 21          # sell-volume and close-weakness lookback
  limit_window: 63    # matches the document's own limit_*_frac window
  labels:
    - binh_thuong
    - ban_thao_nhe
    - ban_thao
    - ban_thao_manh

composite:
  weights:
    pvdi: 0.40
    turnover: 0.30
    volatility: 0.15
    range: 0.15
  thresholds: [0.75, 1.5, 2.25]

labels:
  - binh_thuong
  - dau_co_nhe
  - dau_co
  - dau_co_manh
