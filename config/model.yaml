# Model and cross-validation settings.

dataset:
  # Ranked features only. A tree splits on absolute thresholds, so raw values
  # would bake the market regime into the model — 2% daily vol means "calm" in
  # one year and "panic" in another, and one split cannot be right for both.
  use_ranked_features: true
  # Skip the earliest years: the market was small and the adjustment history is
  # least reliable there. Set to null to use everything.
  start_date: "2010-01-01"

cv:
  n_splits: 6
  embargo: 5
  min_train_days: 750   # ~3 years before the first fold is scored

lightgbm:
  objective: regression      # on the cross-sectional rank, 0..1
  n_estimators: 400
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 200     # cross-sectional data is noisy; keep leaves large
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  verbose: -1

xgboost:
  objective: "reg:squarederror"
  n_estimators: 400
  learning_rate: 0.03
  max_depth: 6
  min_child_weight: 200
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
