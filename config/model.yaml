# Model and cross-validation settings.

dataset:
  # Ranked features only. A tree splits on absolute thresholds, so raw values
  # would bake the market regime into the model — 2% daily vol means "calm" in
  # one year and "panic" in another, and one split cannot be right for both.
  use_ranked_features: true

  # What the model ranks:
  #   residual  fwd_ret - beta * benchmark_ret
  #   raw       fwd_ret
  # Simple excess return (fwd_ret - benchmark_ret) is NOT an option because it
  # is rank-invariant: every stock on a given day shares the same benchmark
  # window, so subtracting it leaves the within-day ordering unchanged. Only the
  # beta term varies by stock, and it is what stops the model from rewarding a
  # name that rose merely because it is high beta and the market rose.
  target: residual

  # index_series starts 2019-09-12. Anything benchmark-relative before that has
  # no benchmark, so this is a hard floor, not a preference.
  start_date: "2019-09-12"

  # FROZEN HOLDOUT. Excluded from load() unless explicitly requested. The
  # pipeline was developed while watching results, so the walk-forward score is
  # optimistic by an unknown amount; this is the only untouched data left.
  # Do not train on it, tune against it, or look at it more than once.
  holdout_start: "2024-01-01"

cv:
  # Smaller than before because the benchmarked sample is 6.8 years, not 16.
  n_splits: 4
  embargo: 5
  min_train_days: 400

lightgbm:
  objective: regression      # on the cross-sectional rank, 0..1
  n_estimators: 400
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 200     # cross-sectional data is noisy; keep leaves large
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  verbose: -1

xgboost:
  objective: "reg:squarederror"
  n_estimators: 400
  learning_rate: 0.03
  max_depth: 6
  min_child_weight: 200
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
